# Weekly bumps. `pip` covers the [dev] extra; the package itself has zero runtime dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
  # Hook revs in .pre-commit-config.yaml. ruff's `ruff==` pin in [dev] is the
  # pip ecosystem's job and must be kept in step by hand (see AGENTS.md).
  - package-ecosystem: pre-commit
    directory: /
    schedule: { interval: weekly }
