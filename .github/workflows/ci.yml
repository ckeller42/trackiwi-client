# House-style CI: pre-commit gates, test matrix, strict mypy, docs/traceability.
name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  # PRs share a group per ref (superseded runs are cancelled); every push gets its own group,
  # because a shared group would still cancel an older *pending* run on main.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # Cancel superseded PR runs only; a push to main always runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: { contents: read }
jobs:
  # Version-independent gates run ONCE, on the target version — not across the matrix.
  #
  # This must be `pre-commit run --all-files` rather than a bare `ruff` call, for two
  # reasons:
  #   1. The ruff-format hook is deliberately scoped to Python. A bare `ruff format`
  #      also rewrites Python code fences inside docs/, which would fail this stage
  #      on a repo whose docs are correct.
  #   2. It is the third enforcement layer for the no-private-data guard. The local
  #      hook can be bypassed with `git commit --no-verify`; this cannot.
  # pre-commit is the single source of truth for tool versions (ruff, gitleaks,
  # markdownlint-cli2, detect-secrets), so there are no separate lint jobs.
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0            # the gitleaks history scan needs every commit
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev]"
      # Cache the hook environments so the gate stays fast.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.13-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Gates (lint, format, markdown, secrets, private-data guard)
        run: pre-commit run --all-files --show-diff-on-failure
      # The stock gitleaks hook scans only staged changes, a no-op under
      # --all-files; this manual-stage twin scans the checked-out tree.
      - name: gitleaks (working tree)
        run: pre-commit run --hook-stage manual gitleaks-dir --all-files
      # A secret deleted from the tree is still in history, and the repo is public.
      - name: gitleaks (full history)
        run: pre-commit run --hook-stage manual gitleaks-history --all-files

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]    # floor from requires-python .. the buspi target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install -e ".[dev]"
      # The package itself has zero runtime dependencies; [dev] brings pytest/ruff/pre-commit.
      - run: python -m pytest -q --cov=trackiwi --cov-report=term-missing --cov-fail-under=95

  # Static type gate (strict). Version-independent, so it runs ONCE on the
  # target version, not across the matrix (house style). A direct `mypy`
  # call over the installed package — not a mirrors-mypy pre-commit hook —
  # so it type-checks the real sources and reads the [tool.mypy] config
  # rather than an isolated hook environment. `python_version` in the config
  # keeps the checked semantics at the 3.11 floor regardless of the runner.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Type check (mypy strict)
        run: |
          mypy
          mypy --allow-untyped-defs --allow-untyped-calls --allow-incomplete-defs --allow-untyped-decorators tests

  # Docs + traceability gate. Version-independent, so it runs ONCE on the target
  # version rather than across the matrix (house style). It builds the
  # sphinx-needs requirements traceability under `-W` — which fails the build if
  # any requirement has no verifying test — runs the pure-function doctests, and
  # enforces docstring coverage. Only the HTML *hosting* is deferred until the
  # repo is public; the build itself gates every push and PR now.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Doctests (pure functions only)
        run: python -m pytest --doctest-modules trackiwi -q
      - name: Requirements traceability (sphinx-needs, -W fails on an untraced req)
        run: sphinx-build -b html -W docs docs/_build/html
      - name: Docstring coverage (interrogate)
        run: interrogate trackiwi

  # Packaging smoke test (NOT a required check): the sdist/wheel build, the
  # metadata check, and a clean-venv install of the wheel that runs the console
  # script. Tooling is installed inline so the [dev] extra stays unchanged.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.13" }
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel into a clean venv and run the entry point
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/trackiwi" --help
