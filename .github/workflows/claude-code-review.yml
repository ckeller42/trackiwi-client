name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# Least privilege by default; each job widens only what it needs.
permissions:
  contents: read

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post review comments / replies
      issues: write # reply to @claude on issues
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The code-review plugin declares these tools in its own frontmatter
          # (read-only gh commands + posting comments); it also launches
          # sub-agents (Agent; Task is the older name) and reads CLAUDE.md (Read/Glob/Grep). Allowing only
          # the inline-comment tool made every read fail (21 permission denials,
          # nothing posted). Nothing here can push code: `contents: read` above.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Agent,Task,Read,Glob,Grep"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # TEMPORARY (#8): show the transcript so the denied tool call is visible.
          show_full_output: true
          # TEMPORARY (#8): the action's OIDC token exchange refuses a workflow
          # file that differs from main, so a PR editing this file never runs it.
          # A supplied token skips that exchange; comments then come from
          # github-actions[bot]. Removed before merge.
          github_token: ${{ github.token }}

      # A denied tool call ends the review early with nothing posted, and the
      # action still reports success (#8). Read the denials from the action's
      # execution file and fail the job if there were any.
      - name: Fail on permission denials
        if: ${{ !cancelled() }}
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "::error::Claude did not run (no execution file). A workflow file that differs from main makes the action skip itself; the PR was not reviewed."
            exit 1
          fi
          denials=$(jq -c '[.[] | select(.type == "result") | .permission_denials[]?]' "$EXECUTION_FILE")
          count=$(jq 'length' <<<"$denials")
          if [ "$count" -gt 0 ]; then
            echo "::error::$count tool call(s) were denied; the review stopped early. Denied calls:"
            jq -r '.[] | "  \(.tool_name): \(.tool_input | tojson | .[0:300])"' <<<"$denials"
            exit 1
          fi
          echo "permission denials: 0"
