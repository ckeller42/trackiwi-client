name: Dependabot auto-merge
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

# Serialize merges so several CI runs completing together don't race each other
# into a now-conflicting PR. `queue: max` keeps every pending run — the default
# (`single`) keeps only one and cancels older pending runs, which would silently
# drop merge attempts when several Dependabot PRs go green at once.
concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false
  queue: max

jobs:
  auto-merge:
    # Fires only after CI already succeeded for this exact commit — intentionally
    # independent of the repo's "Allow auto-merge" toggle and of branch-protection
    # required-checks, so it needs no repo settings to be correct.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR and check eligibility
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          number=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.pull_requests[0].number // empty')
          if [ -z "$number" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

          # `gh pr view --json author` reports bots as "app/dependabot"; the REST
          # user login is the canonical "dependabot[bot]".
          author=$(gh api "repos/$REPO/pulls/$number" --jq '.user.login')
          if [ "$author" != "dependabot[bot]" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Dependabot stamps each commit with a structured trailer per bumped
          # dependency: "update-type: version-update:semver-{major,minor,patch}".
          # Eligible iff at least one trailer exists and none is a major bump —
          # covers grouped updates and SHA-pinned actions, which a title parse
          # can't classify. `|| true` keeps a no-match grep from tripping bash -e.
          types=$(gh pr view "$number" --repo "$REPO" --json commits --jq '.commits[].messageBody' \
                  | grep -oE 'update-type: version-update:semver-[a-z]+' | sort -u || true)
          if [ -z "$types" ] || echo "$types" | grep -q 'semver-major'; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping auto-merge for #$number — major bump or no update-type trailer: ${types:-<none>}"
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Merge
        if: steps.check.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.check.outputs.number }}
          # Pin the merge to the commit CI actually validated. If Dependabot rebased
          # the PR meanwhile, GitHub refuses (409) and the new head's own CI run
          # re-triggers this workflow.
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: gh pr merge "$NUMBER" --repo "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA"
