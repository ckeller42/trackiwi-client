[build-system]
# setuptools>=77 understands the PEP 639 `license = "<SPDX>"` string form and
# `license-files`; the older table form is deprecated under it.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trackiwi"
dynamic = ["version"]
description = "Read-only client for a personal trackiwi GPS account"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
# The package itself has ZERO runtime dependencies; everything here is tooling.
# sphinx-needs is pinned because its config API (needs_links, which replaced the
# deprecated needs_extra_links; needs_warnings;
# the -W build-failure behaviour) is version-sensitive; sphinx is capped so a
# future major cannot silently change the traceability gate.
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    # Keep in step with the ruff-pre-commit `rev` in .pre-commit-config.yaml.
    "ruff==0.16.10",
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
    "sphinx>=8,<10",
    "sphinx-needs==8.5.0",
    "sphinxcontrib-mermaid==2.1.1",
    "furo==2025.12.19",
    "interrogate>=1.7",
    # Pinned exactly: strict mode's finding set is version-sensitive (new checks
    # land in minor releases), so a pin keeps the type gate reproducible — same
    # reasoning as the sphinx-needs pin above. No third-party stubs are needed
    # because the package imports only the standard library.
    "mypy==2.4.0",
]

[project.scripts]
trackiwi = "trackiwi.cli:main"

[tool.setuptools.dynamic]
version = { attr = "trackiwi.__version__" }   # the one place the version lives

[tool.setuptools.packages.find]
include = ["trackiwi*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real trackiwi API; requires TRACKIWI_LIVE=1"]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["trackiwi"]
# __main__.py is a 3-line entry-point shim for `python -m trackiwi`. It is
# tested (tests/test_main_module.py runs it in a subprocess), but a subprocess
# is invisible to in-process coverage, so measuring it here would always read
# 0%. Omitted for that reason, not to inflate the number.
omit = ["trackiwi/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.interrogate]
# Docstring-coverage gate. Measured 100% of the public surface with these
# ignores in place, so `fail-under` sits at the measured value. Dunder, __init__,
# nested and private `_` helpers are excluded (many private helpers ARE
# documented, but they are not required to be); the public API must be 100%.
fail-under = 100
ignore-init-method = true
ignore-magic = true
ignore-private = true
ignore-semiprivate = true
ignore-nested-functions = true
ignore-module = false
exclude = ["tests", "docs", ".venv", "build", "dist"]

[tool.mypy]
# Static type gate. The package is heavily annotated, so strict is achievable;
# the value is in the errors surfaced at the seams (network JSON, sqlite rows,
# argparse Namespaces). Zero third-party imports means zero stubs to install.
python_version = "3.11"
strict = true
# Beyond `strict`: flag ignores that no longer match a real error, casts that
# do nothing, and code made unreachable by the types (a latent-bug smell).
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
# Tests are checked by a second, relaxed run (flags in tools/ci.sh and CI): test
# functions are left unannotated, so only the "must be annotated" family is off.
files = ["trackiwi", "tools"]
mypy_path = "tools"   # tests import the guard script as a module
