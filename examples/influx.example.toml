# Copy to ~/.config/trackiwi/influx.toml (mode 0600) and adjust.
# Every key can be overridden by TRACKIWI_INFLUX_<KEY> in the environment.
# InfluxDB 2.x / Cloud only.
url = "http://localhost:8086"
org = "home"
bucket = "trackiwi"

# The token is never written here. Name the environment variable that holds it
# (default TRACKIWI_INFLUX_TOKEN):
# token_env = "INFLUXDB_TOKEN"
