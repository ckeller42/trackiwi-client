repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi, jupyter]
  # Maintained secret scanner, defence-in-depth alongside the home-rolled
  # SECRET_RE in tools/check_no_private_data.py. The baseline holds only known
  # synthetic/test fakes (hashed); any new token-shaped string not in it fails.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
  - repo: local
    hooks:
      - id: no-private-data
        name: no private data in repository
        entry: python3 tools/check_no_private_data.py
        language: system
        pass_filenames: true
