# Turnkey stack: InfluxDB 2 + Grafana + trackiwi ingest. Setup, in order
# (README "Option A" has the full walk-through):
#   cp deploy/example.env deploy/.env      # then replace every changeme value
#   docker compose -f deploy/docker-compose.yml up -d influxdb
#   ... create the scoped ingest token (README), put it in deploy/.env ...
#   docker compose -f deploy/docker-compose.yml run --rm ingest trackiwi login
#   docker compose -f deploy/docker-compose.yml up -d
# Grafana: http://localhost:3000 (admin / GRAFANA_ADMIN_PASSWORD)
#
# Published ports bind to 127.0.0.1 by default: InfluxDB and Grafana are
# reachable from this machine only, and the ingest container talks to InfluxDB
# over the compose network, never through a published port. To expose either
# to the LAN deliberately, set INFLUXDB_BIND_ADDRESS / GRAFANA_BIND_ADDRESS in
# deploy/.env (see README "Exposing the stack to the LAN").
services:
  influxdb:
    image: influxdb:2
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    ports:
      - "${INFLUXDB_BIND_ADDRESS:-127.0.0.1}:8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    depends_on:
      - influxdb
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    volumes:
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
      - ./grafana-dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  ingest:
    build:
      context: ..
      dockerfile: deploy/ingest/Dockerfile
    restart: unless-stopped
    depends_on:
      - influxdb
    environment:
      TRACKIWI_INFLUX_URL: http://influxdb:8086
      TRACKIWI_INFLUX_VERSION: "2"
      TRACKIWI_INFLUX_ORG: ${INFLUXDB_ORG}
      TRACKIWI_INFLUX_BUCKET: ${INFLUXDB_BUCKET}
      # Not the admin token: a token scoped to read + write on this one
      # bucket (README "Option A" shows the `influx auth create` call). Write
      # is what `push` needs; read is what `influx check` needs to see the
      # bucket exists (`GET /api/v2/buckets` lists only readable buckets).
      TRACKIWI_INFLUX_TOKEN: ${INFLUXDB_INGEST_TOKEN}
      TRACKIWI_INGEST_INTERVAL: ${TRACKIWI_INGEST_INTERVAL:-600}
    volumes:
      # Holds ~/.config/trackiwi (session) and ~/.local/share/trackiwi (the
      # cache that buffers positions while InfluxDB is unreachable).
      - trackiwi-state:/home/trackiwi

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
  trackiwi-state:
